# Optional tuning for small-memory hosts that swap to zram (e.g. 4-8 GB routers/NAS).
# Copy to /etc/sysctl.d/ and run `sysctl --system` (OpenWrt: /etc/sysctl.d/ then reboot).
# Review each value for your machine; these are not universally better.
# zram does not benefit from swap read-ahead: swap in one page at a time
vm.page-cluster=0
# zram swap is cheaper than dropping page cache (default 60)
vm.swappiness=100
# keep more memory free for network and interrupts (default often 16384..67584)
vm.min_free_kbytes=65536
# start kswapd earlier, fewer direct-reclaim stalls (default 10)
vm.watermark_scale_factor=100
# spinning disks: smaller dirty-page batches avoid long global write stalls (default 10/20)
vm.dirty_background_ratio=3
vm.dirty_ratio=8
