name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write        # create the GitHub release
  id-token: write        # sign the provenance attestation
  attestations: write    # store it
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build (same script as local builds)
        run: scripts/build-release.sh --tag "${GITHUB_REF_NAME}"
      - name: verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/server-autoops-*.tar.gz
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/server-autoops-*.tar.gz dist/SHA256SUMS \
            --title "server-autoops ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md --verify-tag
